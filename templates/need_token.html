<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
        :root { color-scheme: light dark; --bg: #f6f6f9; --surface: #fff; --text: #1d1d27; --muted: #5d5d70;
                --border: #e2e2ea; --accent: #6d5ef2; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #121218; --surface: #1c1c25; --text: #ececf3; --muted: #a0a0b4;
                    --border: #2e2e3a; --accent: #8577ff; }
        }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
               color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { width: min(440px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--border);
               border-radius: 14px; padding: 28px; box-sizing: border-box; }
        h1 { margin: 0 0 12px; font-size: 20px; }
        p { margin: 0 0 20px; color: var(--muted); }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
        .row { display: flex; gap: 8px; }
        input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
                background: var(--bg); color: var(--text); font: inherit; }
        button { padding: 9px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
                 font: inherit; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <h1>{{ title }}</h1>
    <p>{{ message | safe }}</p>
    <form action="" method="get">
        <label for="token_input">{{ token_label }}</label>
        <div class="row">
            <input type="password" id="token_input" name="token" autocomplete="off" autofocus>
            <button type="submit">{{ submit }}</button>
        </div>
    </form>
</main>
</body>
</html>
