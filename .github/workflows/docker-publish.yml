# 构建多架构镜像并推送到 GHCR(ghcr.io/<owner>/<repo>)。
#   push master      → :edge、:sha-<短 commit>
#   push tag v1.2.3  → :1.2.3、:1.2、:latest、:sha-<短 commit>
# 每个镜像附带 SBOM + 构建来源证明(provenance),推送后用 Trivy 扫描漏洞,
# 结果进仓库 Security → Code scanning。
# 改动镜像相关文件的 PR 只做双架构构建验证(不登录、不推送),
# 避免 arm64 构建问题合并后才在发布时暴露。
name: Docker publish

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - entrypoint.sh
      - requirements.txt
      - webui/package.json
      - webui/package-lock.json
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # 推送到 GHCR
      id-token: write # 签发构建来源证明
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name (lowercase)
        id: image
        # GHCR 要求小写,而仓库名 AidenOfficial/Mumble-DJBot 含大写
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # latest 只跟正式版 tag 走(semver 且非预发布),master 上的提交只更新 edge
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=Mumble DJBot
            org.opencontainers.image.description=Mumble music bot with a web UI

      - name: Build & push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max

      - name: Attest build provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: ${{ github.event_name != 'pull_request' }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Digest: \`$DIGEST\`"
            echo
            echo "验证来源:\`gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 扫描单独成 job:只给读权限,第三方扫描器拿不到推送 / 签名用的 token
  scan:
    name: Trivy scan
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # GHCR 包默认私有时需要它来拉镜像
      security-events: write # 上传 SARIF
    steps:
      - name: Scan image
        # 2026-03 trivy-action 曾发生 tag 劫持(CVE-2026-33634),务必锁定 commit SHA
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # 只报告不拦截:Debian 基础镜像总会有暂无修复的 CVE
          exit-code: "0"

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
