# CodeQL 静态安全分析:Python 后端、Vue/TS 前端,以及 workflow 本身。
# 结果在仓库 Security → Code scanning。
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # 每周三跑一次,新增的查询规则也能覆盖到老代码
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # 三种语言都是解释型 / 无需编译
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              # 提交进仓库的前端构建产物,源码在 webui/src 已分析
              - webui/dist
              - tests

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
